<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sponsorship CRM — Convena</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;600;700&family=Space+Grotesk:wght@700;800&display=swap"
    rel="stylesheet"
  />

  <!-- External CSS -->
  <link rel="stylesheet" href="style.css" />

  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function SponsorshipPage() {
      const [leads, setLeads] = useState([
        { id: 1, company: 'PT Telkom Indonesia', package: 'Platinum Sponsor', value: 35000000, stage: 'Lunas' },
        { id: 2, company: 'GoTo Financial', package: 'Gold Sponsor', value: 20000000, stage: 'Negosiasi' },
        { id: 3, company: 'Dicoding Indonesia', package: 'Silver Sponsor', value: 10000000, stage: 'Proposal Terkirim' },
      ]);

      const [company, setCompany] = useState('');
      const [pkg, setPkg] = useState('Gold Sponsor');
      const [value, setValue] = useState('');

      const handleAddSponsor = (e) => {
        e.preventDefault();
        if (!company || !value) return;
        setLeads([
          ...leads,
          { id: Date.now(), company, package: pkg, value: Number(value), stage: 'Proposal Terkirim' },
        ]);
        setCompany('');
        setValue('');
      };

      const handleStageChange = (id, newStage) => {
        setLeads(leads.map((l) => (l.id === id ? { ...l, stage: newStage } : l)));
      };

      return (
        <>
          <header className="navbar">
            <a href="index.html" className="brand">
              <div className="brand-box">C</div>
              <span>CONVENA</span>
            </a>
            <nav className="nav-links">
              <a href="index.html">Home</a>
              <a href="events.html">Events</a>
              <a href="dashboard.html">Dashboard</a>
              <a href="sponsorship.html" className="active">Sponsorship</a>
              <a href="finances.html">Budget & SPJ</a>
              <a href="verify.html">Verify</a>
              <a href="login.html">Login</a>
              <a href="register.html">Register</a>
            </nav>
          </header>

          <main className="container">
            <h1 style={{ fontFamily: 'var(--font-display)', fontSize: '2rem', marginBottom: '0.25rem' }}>
              Sponsorship Pipeline CRM
            </h1>
            <p style={{ color: '#6B7280', marginBottom: '1.5rem' }}>
              Kelola daftar calon mitra perusahaan dan tahapan komitmen sponsor acara.
            </p>

            <div className="box">
              <h3 style={{ fontFamily: 'var(--font-display)', marginBottom: '0.75rem' }}>+ Tambah Calon Sponsor</h3>
              <form
                onSubmit={handleAddSponsor}
                style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(180px, 1fr))', gap: '0.75rem' }}
              >
                <input placeholder="Nama Perusahaan" value={company} onChange={(e) => setCompany(e.target.value)} required />
                <select value={pkg} onChange={(e) => setPkg(e.target.value)}>
                  <option value="Platinum Sponsor">Platinum Sponsor</option>
                  <option value="Gold Sponsor">Gold Sponsor</option>
                  <option value="Silver Sponsor">Silver Sponsor</option>
                </select>
                <input type="number" placeholder="Nilai Paket (Rp)" value={value} onChange={(e) => setValue(e.target.value)} required />
                <button type="submit" className="btn" style={{ background: 'var(--mem-pink)', color: '#FFF' }}>
                  + Tambah Mitra
                </button>
              </form>
            </div>

            <div className="box">
              <h3 style={{ fontFamily: 'var(--font-display)', marginBottom: '0.75rem' }}>Daftar Mitra Sponsor</h3>
              <table>
                <thead>
                  <tr>
                    <th>Perusahaan</th>
                    <th>Paket</th>
                    <th>Nilai (Rp)</th>
                    <th>Status Pipeline</th>
                  </tr>
                </thead>
                <tbody>
                  {leads.map((item) => (
                    <tr key={item.id}>
                      <td><strong>{item.company}</strong></td>
                      <td>{item.package}</td>
                      <td style={{ fontFamily: 'var(--font-mono)', fontWeight: 700 }}>
                        Rp {item.value.toLocaleString('id-ID')}
                      </td>
                      <td>
                        <select
                          value={item.stage}
                          onChange={(e) => handleStageChange(item.id, e.target.value)}
                          style={{ background: item.stage === 'Lunas' ? 'var(--mem-mint)' : 'var(--mem-yellow)' }}
                        >
                          <option value="Proposal Terkirim">Proposal Terkirim</option>
                          <option value="Negosiasi">Negosiasi</option>
                          <option value="Lunas">Lunas</option>
                        </select>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </main>

          <footer className="footer">&copy; 2026 Convena — Platform Manajemen Event & Organisasi Mahasiswa</footer>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<SponsorshipPage />);
  </script>
</body>

</html>
