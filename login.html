<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Convena Student Org Platform</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap"
    rel="stylesheet"
  />

  <!-- External CSS -->
  <link rel="stylesheet" href="style.css" />

  <!-- React & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function LoginPage() {
      const [email, setEmail] = useState('raissa@student.telkomuniversity.ac.id');
      const [password, setPassword] = useState('password123');
      const [role, setRole] = useState('treasurer');
      const [statusMsg, setStatusMsg] = useState('');

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!email || !password) return;

        // Simpan sesi login ke localStorage
        const userSession = {
          id: 'usr-raissa',
          name: email.split('@')[0].toUpperCase(),
          email: email,
          role: role,
        };
        localStorage.setItem('convena_auth_token', 'mock_token_' + Date.now());
        localStorage.setItem('convena_auth_user', JSON.stringify(userSession));

        setStatusMsg('Login berhasil! Mengalihkan ke halaman Budget & SPJ...');

        setTimeout(() => {
          window.location.href = 'finances.html';
        }, 700);
      };

      return (
        <>
          {/* Navbar */}
          <header className="navbar">
            <a href="index.html" className="brand">
              <div className="brand-box">C</div>
              <span className="brand-title">CONVENA</span>
            </a>
            <nav className="nav-links">
              <a href="index.html" className="nav-link">Home</a>
              <a href="events.html" className="nav-link">Events</a>
              <a href="dashboard.html" className="nav-link">Dashboard</a>
              <a href="sponsorship.html" className="nav-link">Sponsorship</a>
              <a href="finances.html" className="nav-link">Budget & SPJ</a>
              <a href="verify.html" className="nav-link">Verify</a>
              <a href="login.html" className="nav-link active">Login</a>
              <a href="register.html" className="nav-link">Register</a>
            </nav>
          </header>

          {/* Konten Utama Login */}
          <main className="main-wrapper">
            <div className="login-container">
              <div style={{ textAlign: 'center', marginBottom: '1.5rem' }}>
                <span className="memphis-badge">PORTAL ORMAWA CONVENA</span>
                <h1 style={{ fontFamily: 'var(--font-display)', fontSize: '2.1rem', fontWeight: 800 }}>
                  Masuk Akun
                </h1>
                <p style={{ color: 'var(--mem-gray-500)', fontSize: '0.9rem', marginTop: '4px' }}>
                  Kelola kegiatan, anggaran RAB, dan laporan SPJ organisasi Anda.
                </p>
              </div>

              <div className="memphis-card">
                <div className="card-header">Autentikasi Pengurus & Mahasiswa</div>
                <div className="card-body">
                  {statusMsg && <div className="alert-box">✅ {statusMsg}</div>}

                  <form onSubmit={handleSubmit}>
                    <div className="form-group">
                      <label className="form-label">Email Mahasiswa / Pengurus</label>
                      <input
                        type="email"
                        className="form-input"
                        placeholder="raissa@student.telkomuniversity.ac.id"
                        value={email}
                        onChange={(e) => setEmail(e.target.value)}
                        required
                      />
                    </div>

                    <div className="form-group">
                      <label className="form-label">Kata Sandi</label>
                      <input
                        type="password"
                        className="form-input"
                        placeholder="Masukkan kata sandi"
                        value={password}
                        onChange={(e) => setPassword(e.target.value)}
                        required
                      />
                    </div>

                    <div className="form-group">
                      <label className="form-label">Masuk Sebagai Peran (Role)</label>
                      <select
                        className="form-select"
                        value={role}
                        onChange={(e) => setRole(e.target.value)}
                      >
                        <option value="treasurer">Bendahara / Keuangan (SPJ)</option>
                        <option value="admin">Admin Organisasi</option>
                        <option value="committee">Panitia Acara</option>
                        <option value="attendee">Peserta / Mahasiswa</option>
                      </select>
                    </div>

                    <button type="submit" className="memphis-btn">
                      Masuk ke Convena
                    </button>
                  </form>

                  <div className="auth-footer">
                    Belum punya akun? <a href="register.html">Daftar di sini →</a>
                  </div>
                </div>
              </div>
            </div>
          </main>

          {/* Footer */}
          <footer className="footer">
            &copy; 2026 Convena — Platform Manajemen Event & Organisasi Mahasiswa
          </footer>
        </>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<LoginPage />);
  </script>
</body>

</html>
