<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Explore Events — Convena</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;600;700&family=Space+Grotesk:wght@700;800&display=swap"
    rel="stylesheet"
  />

  <!-- External CSS -->
  <link rel="stylesheet" href="style.css" />

  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function EventsPage() {
      const [search, setSearch] = useState('');
      const [events, setEvents] = useState([
        { id: 1, title: 'Arkavidia 9.0: National Tech Festival', org: 'HMIF ITB', category: 'Festival', venue: 'Aula Barat ITB', price: 35000 },
        { id: 2, title: 'UI Youth Leadership Forum 2026', org: 'BEM UI', category: 'Seminar', venue: 'Balairung UI', price: 0 },
        { id: 3, title: 'UGM AI & Robotics Workshop', org: 'HMEI UGM', category: 'Workshop', venue: 'Grha Sabha Pramana', price: 50000 },
      ]);

      const [newTitle, setNewTitle] = useState('');
      const [newOrg, setNewOrg] = useState('HMIF ITB');
      const [newVenue, setNewVenue] = useState('');
      const [newPrice, setNewPrice] = useState('');

      const handleCreate = (e) => {
        e.preventDefault();
        if (!newTitle || !newVenue) return;
        setEvents([
          { id: Date.now(), title: newTitle, org: newOrg, category: 'Seminar', venue: newVenue, price: Number(newPrice) || 0 },
          ...events,
        ]);
        setNewTitle('');
        setNewVenue('');
        setNewPrice('');
      };

      const filtered = events.filter((ev) => ev.title.toLowerCase().includes(search.toLowerCase()));

      return (
        <>
          <header className="navbar">
            <a href="index.html" className="brand">
              <div className="brand-box">C</div>
              <span>CONVENA</span>
            </a>
            <nav className="nav-links">
              <a href="index.html">Home</a>
              <a href="events.html" className="active">Events</a>
              <a href="dashboard.html">Dashboard</a>
              <a href="sponsorship.html">Sponsorship</a>
              <a href="finances.html">Budget & SPJ</a>
              <a href="verify.html">Verify</a>
              <a href="login.html">Login</a>
            </nav>
          </header>

          <main className="container">
            <h1 style={{ fontFamily: 'var(--font-display)', fontSize: '2.1rem', marginBottom: '0.25rem' }}>
              Katalog Event Kampus
            </h1>
            <p style={{ color: '#6B7280', marginBottom: '1.5rem' }}>
              Temukan acara kemahasiswaan atau tambahkan event baru organisasi Anda.
            </p>

            {/* Form Buat Event Baru */}
            <div className="box" style={{ background: '#FFF585' }}>
              <h3 style={{ fontFamily: 'var(--font-display)', marginBottom: '0.75rem' }}>+ Buat Event Baru</h3>
              <form
                onSubmit={handleCreate}
                style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(180px, 1fr))', gap: '0.75rem' }}
              >
                <input placeholder="Nama Event" value={newTitle} onChange={(e) => setNewTitle(e.target.value)} required />
                <input placeholder="Penyelenggara (Ormawa)" value={newOrg} onChange={(e) => setNewOrg(e.target.value)} required />
                <input placeholder="Lokasi / Venue" value={newVenue} onChange={(e) => setNewVenue(e.target.value)} required />
                <input type="number" placeholder="Harga Tiket (Rp)" value={newPrice} onChange={(e) => setNewPrice(e.target.value)} />
                <button type="submit" className="btn" style={{ background: 'var(--mem-pink)', color: '#FFF' }}>
                  Simpan Event
                </button>
              </form>
            </div>

            {/* Pencarian */}
            <div style={{ marginBottom: '1.5rem' }}>
              <input
                placeholder="🔍 Cari nama event kampus..."
                value={search}
                onChange={(e) => setSearch(e.target.value)}
              />
            </div>

            {/* Grid Event */}
            <div className="grid-3">
              {filtered.map((ev) => (
                <div key={ev.id} className="box" style={{ marginBottom: 0 }}>
                  <small style={{ fontFamily: 'var(--font-mono)', fontWeight: 700 }}>{ev.org} • {ev.category}</small>
                  <h3 style={{ fontFamily: 'var(--font-display)', margin: '0.4rem 0' }}>{ev.title}</h3>
                  <p style={{ fontSize: '0.85rem', color: '#6B7280', marginBottom: '1rem' }}>📍 {ev.venue}</p>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                    <strong style={{ fontFamily: 'var(--font-mono)' }}>
                      {ev.price === 0 ? 'GRATIS' : 'Rp ' + ev.price.toLocaleString('id-ID')}
                    </strong>
                    <button
                      type="button"
                      className="btn"
                      onClick={() => alert('Pendaftaran berhasil untuk event: ' + ev.title)}
                    >
                      Daftar Tiket
                    </button>
                  </div>
                </div>
              ))}
            </div>
          </main>

          <footer className="footer">&copy; 2026 Convena — Platform Manajemen Event & Organisasi Mahasiswa</footer>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<EventsPage />);
  </script>
</body>

</html>
