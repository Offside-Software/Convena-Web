<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — Convena Student Org Platform</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap"
    rel="stylesheet"
  />

  <!-- External CSS -->
  <link rel="stylesheet" href="style.css" />

  <!-- React & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function RegisterPage() {
      const [name, setName] = useState('');
      const [university, setUniversity] = useState('Telkom University');
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [role, setRole] = useState('treasurer');
      const [statusMsg, setStatusMsg] = useState('');

      const handleRegister = (e) => {
        e.preventDefault();
        if (!name || !email || !password) return;

        // Simpan data akun baru ke localStorage
        const newUser = {
          id: 'usr-' + Date.now(),
          name: name,
          university: university,
          email: email,
          role: role,
        };
        localStorage.setItem('convena_auth_token', 'mock_token_' + Date.now());
        localStorage.setItem('convena_auth_user', JSON.stringify(newUser));

        setStatusMsg('Pendaftaran berhasil! Mengalihkan ke halaman Login...');

        setTimeout(() => {
          window.location.href = 'login.html';
        }, 700);
      };

      return (
        <>
          {/* Navbar */}
          <header className="navbar">
            <a href="index.html" className="brand">
              <div className="brand-box">C</div>
              <span className="brand-title">CONVENA</span>
            </a>
            <nav className="nav-links">
              <a href="index.html" className="nav-link">Home</a>
              <a href="events.html" className="nav-link">Events</a>
              <a href="dashboard.html" className="nav-link">Dashboard</a>
              <a href="sponsorship.html" className="nav-link">Sponsorship</a>
              <a href="finances.html" className="nav-link">Budget & SPJ</a>
              <a href="verify.html" className="nav-link">Verify</a>
              <a href="login.html" className="nav-link">Login</a>
              <a href="register.html" className="nav-link active">Register</a>
            </nav>
          </header>

          {/* Konten Utama Register */}
          <main className="main-wrapper">
            <div className="register-container">
              <div style={{ textAlign: 'center', marginBottom: '1.5rem' }}>
                <span className="memphis-badge" style={{ background: 'var(--mem-mint)' }}>
                  REGISTRASI AKUN BARU
                </span>
                <h1 style={{ fontFamily: 'var(--font-display)', fontSize: '2.1rem', fontWeight: 800 }}>
                  Daftar Akun Ormawa
                </h1>
                <p style={{ color: 'var(--mem-gray-500)', fontSize: '0.9rem', marginTop: '4px' }}>
                  Buat akun pengurus atau peserta untuk terhubung ke ekosistem Convena.
                </p>
              </div>

              <div className="memphis-card">
                <div className="card-header" style={{ background: 'var(--mem-cyan)' }}>
                  Formulir Pendaftaran Mahasiswa & Pengurus
                </div>
                <div className="card-body">
                  {statusMsg && <div className="alert-box">✅ {statusMsg}</div>}

                  <form onSubmit={handleRegister}>
                    <div className="form-group">
                      <label className="form-label">Nama Lengkap</label>
                      <input
                        type="text"
                        className="form-input"
                        placeholder="Contoh: Raissa Putri"
                        value={name}
                        onChange={(e) => setName(e.target.value)}
                        required
                      />
                    </div>

                    <div className="form-group">
                      <label className="form-label">Asal Kampus / Universitas</label>
                      <input
                        type="text"
                        className="form-input"
                        placeholder="Contoh: Telkom University / ITB / UI"
                        value={university}
                        onChange={(e) => setUniversity(e.target.value)}
                        required
                      />
                    </div>

                    <div className="form-group">
                      <label className="form-label">Email Kampus (.ac.id)</label>
                      <input
                        type="email"
                        className="form-input"
                        placeholder="raissa@student.telkomuniversity.ac.id"
                        value={email}
                        onChange={(e) => setEmail(e.target.value)}
                        required
                      />
                    </div>

                    <div className="form-group">
                      <label className="form-label">Kata Sandi Baru</label>
                      <input
                        type="password"
                        className="form-input"
                        placeholder="Minimal 8 karakter"
                        value={password}
                        onChange={(e) => setPassword(e.target.value)}
                        required
                      />
                    </div>

                    <div className="form-group">
                      <label className="form-label">Daftar Sebagai Peran (Role)</label>
                      <select
                        className="form-select"
                        value={role}
                        onChange={(e) => setRole(e.target.value)}
                      >
                        <option value="treasurer">Bendahara / Keuangan (SPJ)</option>
                        <option value="admin">Admin Organisasi</option>
                        <option value="committee">Panitia Acara</option>
                        <option value="attendee">Peserta / Mahasiswa</option>
                      </select>
                    </div>

                    <button
                      type="submit"
                      className="memphis-btn"
                      style={{ background: 'var(--mem-yellow)', color: 'var(--mem-dark)' }}
                    >
                      Daftar Akun Sekarang
                    </button>
                  </form>

                  <div className="auth-footer">
                    Sudah punya akun? <a href="login.html">Masuk di sini →</a>
                  </div>
                </div>
              </div>
            </div>
          </main>

          <footer className="footer">
            &copy; 2026 Convena — Platform Manajemen Event & Organisasi Mahasiswa
          </footer>
        </>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<RegisterPage />);
  </script>
</body>

</html>
