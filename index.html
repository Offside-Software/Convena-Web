<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Convena — Student Event & Organization Platform</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap"
    rel="stylesheet"
  />

  <!-- External CSS -->
  <link rel="stylesheet" href="style.css" />

  <!-- React & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function HomePage() {
      const [events] = useState([
        {
          id: 'evt-1',
          title: 'Arkavidia 9.0: National Tech Festival & Hackathon',
          org: 'HMIF ITB',
          date: '14 Nov 2026',
          venue: 'Aula Barat ITB, Bandung',
          price: 'Rp 35.000',
          color: 'var(--mem-yellow)',
        },
        {
          id: 'evt-2',
          title: 'UI Youth Leadership & Policy Summit 2026',
          org: 'BEM UI',
          date: '22 Nov 2026',
          venue: 'Balairung UI, Depok',
          price: 'Gratis',
          color: 'var(--mem-cyan)',
        },
        {
          id: 'evt-3',
          title: 'Tel-U Creative Design & Startup Expo',
          org: 'BEM Tel-U',
          date: '05 Des 2026',
          venue: 'Telkom University Convention Hall',
          price: 'Rp 25.000',
          color: 'var(--mem-mint)',
        },
      ]);

      return (
        <>
          <header className="navbar">
            <a href="index.html" className="brand">
              <div className="brand-box">C</div>
              <span>CONVENA</span>
            </a>
            <nav className="nav-links">
              <a href="index.html" className="active">Home</a>
              <a href="events.html">Events</a>
              <a href="dashboard.html">Dashboard</a>
              <a href="sponsorship.html">Sponsorship</a>
              <a href="finances.html">Budget & SPJ</a>
              <a href="verify.html">Verify</a>
              <a href="login.html">Login</a>
              <a href="register.html">Register</a>
            </nav>
          </header>

          {/* Hero Section */}
          <section className="hero">
            <span className="badge">#1 PLATFORM ORMAWA INDONESIA</span>
            <h1
              style={{
                fontFamily: 'var(--font-display)',
                fontSize: 'clamp(2.2rem, 5vw, 3.6rem)',
                fontWeight: 900,
                maxWidth: '820px',
                margin: '0 auto 1rem',
                lineHeight: 1.15,
              }}
            >
              Kelola Acara Kampus & Ormawa{' '}
              <span
                style={{
                  background: 'var(--mem-yellow)',
                  border: 'var(--border)',
                  padding: '0 0.4rem',
                  boxShadow: '4px 4px 0px var(--mem-dark)',
                  display: 'inline-block',
                }}
              >
                Tanpa Ribet
              </span>
            </h1>
            <p
              style={{
                maxWidth: '680px',
                margin: '0 auto 2rem',
                color: '#374151',
                fontSize: '1.05rem',
                lineHeight: 1.6,
              }}
            >
              Dari registrasi tiket acara, pelacakan proposal sponsorship CRM, transparansi anggaran & kuitansi SPJ,
              hingga verifikasi e-sertifikat digital.
            </p>

            <div style={{ display: 'flex', gap: '1rem', justifyContent: 'center', flexWrap: 'wrap' }}>
              <a href="events.html" className="btn" style={{ background: 'var(--mem-pink)', color: '#FFF' }}>
                Jelajahi Event Kampus
              </a>
              <a href="finances.html" className="btn" style={{ background: 'var(--mem-cyan)' }}>
                Buka Budget & SPJ
              </a>
            </div>
          </section>

          {/* Daftar Event Unggulan */}
          <main className="container">
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1.5rem' }}>
              <h2 style={{ fontFamily: 'var(--font-display)', fontSize: '1.8rem' }}>Event Kampus Terpopuler</h2>
              <a href="events.html" style={{ fontFamily: 'var(--font-display)', fontWeight: 800, color: 'var(--mem-dark)' }}>
                Lihat Semua →
              </a>
            </div>

            <div className="grid-3">
              {events.map((ev) => (
                <div key={ev.id} className="card">
                  <div
                    style={{
                      background: ev.color,
                      borderBottom: 'var(--border)',
                      padding: '0.75rem 1.25rem',
                      fontFamily: 'var(--font-display)',
                      fontWeight: 800,
                      fontSize: '0.85rem',
                    }}
                  >
                    {ev.org} • {ev.date}
                  </div>
                  <div className="card-body">
                    <h3 style={{ fontFamily: 'var(--font-display)', fontSize: '1.2rem', marginBottom: '0.5rem' }}>
                      {ev.title}
                    </h3>
                    <p style={{ fontSize: '0.85rem', color: 'var(--mem-gray-500)', marginBottom: '1rem' }}>
                      📍 {ev.venue}
                    </p>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                      <strong style={{ fontFamily: 'var(--font-mono)', fontSize: '1rem' }}>{ev.price}</strong>
                      <a
                        href="events.html"
                        className="btn"
                        style={{ padding: '0.4rem 0.85rem', fontSize: '0.8rem', background: 'var(--mem-yellow)' }}
                      >
                        Detail Acara
                      </a>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </main>

          <footer className="footer">
            &copy; 2026 Convena — Platform Manajemen Event & Organisasi Mahasiswa
          </footer>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<HomePage />);
  </script>
</body>

</html>
