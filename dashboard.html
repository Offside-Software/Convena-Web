<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Panitia — Convena</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;600;700&family=Space+Grotesk:wght@700;800&display=swap"
    rel="stylesheet"
  />

  <!-- External CSS -->
  <link rel="stylesheet" href="style.css" />

  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">
    function DashboardPage() {
      const stats = [
        { label: 'TOTAL PENDAFTAR', value: '1.150 Peserta', bg: '#FFF585' },
        { label: 'SPONSOR TERKUMPUL', value: 'Rp 45,0 Jt', bg: '#FF94BE' },
        { label: 'REALISASI ANGGARAN', value: 'Rp 18,5 Jt', bg: '#70E7FF' },
        { label: 'SPJ PENDING', value: '1 Kuitansi', bg: '#FFFFFF' },
      ];

      return (
        <>
          <header className="navbar">
            <a href="index.html" className="brand">
              <div className="brand-box">C</div>
              <span>CONVENA</span>
            </a>
            <nav className="nav-links">
              <a href="index.html">Home</a>
              <a href="events.html">Events</a>
              <a href="dashboard.html" className="active">Dashboard</a>
              <a href="sponsorship.html">Sponsorship</a>
              <a href="finances.html">Budget & SPJ</a>
              <a href="verify.html">Verify</a>
              <a href="login.html">Login</a>
              <a href="register.html">Register</a>
            </nav>
          </header>

          <main className="container">
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '1rem', marginBottom: '1.5rem' }}>
              <div>
                <h1 style={{ fontFamily: 'var(--font-display)', fontSize: '2.1rem' }}>Dashboard Panitia Ormawa</h1>
                <p style={{ color: '#6B7280' }}>Ringkasan kegiatan kepengurusan HMIF ITB 2026/2027.</p>
              </div>
              <a href="finances.html" className="btn" style={{ background: 'var(--mem-pink)', color: '#FFF' }}>
                Kelola Budget & SPJ →
              </a>
            </div>

            <div className="grid-4">
              {stats.map((st, i) => (
                <div key={i} className="box" style={{ marginBottom: 0, background: st.bg }}>
                  <small style={{ fontFamily: 'var(--font-mono)', fontWeight: 700 }}>{st.label}</small>
                  <h2 style={{ fontFamily: 'var(--font-display)', marginTop: '0.25rem' }}>{st.value}</h2>
                </div>
              ))}
            </div>

            <div className="box">
              <h3 style={{ fontFamily: 'var(--font-display)', marginBottom: '1rem' }}>Menu Cepat Operasional</h3>
              <div style={{ display: 'flex', gap: '1rem', flexWrap: 'wrap' }}>
                <a href="events.html" className="btn" style={{ background: 'var(--mem-yellow)' }}>
                  📅 Kelola Event Kampus
                </a>
                <a href="sponsorship.html" className="btn" style={{ background: 'var(--mem-cyan)' }}>
                  🤝 Pipeline Sponsorship CRM
                </a>
                <a href="finances.html" className="btn" style={{ background: 'var(--mem-mint)' }}>
                  💰 Pencatatan Anggaran & SPJ
                </a>
                <a href="verify.html" className="btn" style={{ background: '#FFFFFF' }}>
                  🛡️ Verifikasi E-Sertifikat
                </a>
              </div>
            </div>
          </main>

          <footer className="footer">&copy; 2026 Convena — Platform Manajemen Event & Organisasi Mahasiswa</footer>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<DashboardPage />);
  </script>
</body>

</html>
