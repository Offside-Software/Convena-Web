<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Panitia — Convena</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;600;700&family=Space+Grotesk:wght@700;800&display=swap"
    rel="stylesheet"
  />

  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --mem-yellow: #FFE600;
      --mem-pink: #FF4B91;
      --mem-cyan: #01CDFE;
      --mem-mint: #00F5D4;
      --mem-bg: #FAF9F6;
      --mem-dark: #121215;
      --border: 3px solid #121215;
      --border-sm: 2px solid #121215;
      --font-display: 'Space Grotesk', sans-serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-body); background: var(--mem-bg); color: var(--mem-dark); min-height: 100vh; display: flex; flex-direction: column; }

    .navbar {
      background: #FFFFFF;
      border-bottom: 4px solid var(--mem-dark);
      padding: 0.85rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .brand { display: flex; align-items: center; gap: 0.6rem; font-family: var(--font-display); font-weight: 900; font-size: 1.4rem; text-decoration: none; color: var(--mem-dark); }
    .brand-box { width: 36px; height: 36px; background: var(--mem-pink); border: var(--border-sm); border-radius: 8px; box-shadow: 2px 2px 0px var(--mem-dark); display: flex; align-items: center; justify-content: center; color: #FFF; }
    .nav-links { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
    .nav-links a { font-family: var(--font-display); font-weight: 700; font-size: 0.85rem; text-decoration: none; color: var(--mem-dark); padding: 0.4rem 0.75rem; border-radius: 6px; border: 2px solid transparent; }
    .nav-links a.active, .nav-links a:hover { background: var(--mem-yellow); border-color: var(--mem-dark); box-shadow: 2px 2px 0px var(--mem-dark); }

    .container { max-width: 1080px; width: 100%; margin: 0 auto; padding: 2.5rem 1.5rem; flex: 1; }
    .grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
    .box { background: #FFFFFF; border: var(--border); box-shadow: 5px 5px 0px var(--mem-dark); border-radius: 10px; padding: 1.25rem; margin-bottom: 1.5rem; }
    .btn { display: inline-block; font-family: var(--font-display); font-weight: 700; text-decoration: none; color: var(--mem-dark); padding: 0.55rem 1rem; border: var(--border-sm); border-radius: 6px; box-shadow: 2px 2px 0px var(--mem-dark); background: var(--mem-yellow); }
    .footer { background: #FFFFFF; border-top: 4px solid var(--mem-dark); text-align: center; padding: 1.25rem; font-size: 0.85rem; color: #6B7280; }
  </style>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">
    function DashboardPage() {
      const stats = [
        { label: 'TOTAL PENDAFTAR', value: '1.150 Peserta', bg: '#FFF585' },
        { label: 'SPONSOR TERKUMPUL', value: 'Rp 45,0 Jt', bg: '#FF94BE' },
        { label: 'REALISASI ANGGARAN', value: 'Rp 18,5 Jt', bg: '#70E7FF' },
        { label: 'SPJ PENDING', value: '1 Kuitansi', bg: '#FFFFFF' },
      ];

      return (
        <>
          <header className="navbar">
            <a href="index.html" className="brand">
              <div className="brand-box">C</div>
              <span>CONVENA</span>
            </a>
            <nav className="nav-links">
              <a href="index.html">Home</a>
              <a href="events.html">Events</a>
              <a href="dashboard.html" className="active">Dashboard</a>
              <a href="sponsorship.html">Sponsorship</a>
              <a href="finances.html">Budget & SPJ</a>
              <a href="verify.html">Verify</a>
              <a href="login.html">Login</a>
            </nav>
          </header>

          <main className="container">
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '1rem', marginBottom: '1.5rem' }}>
              <div>
                <h1 style={{ fontFamily: 'var(--font-display)', fontSize: '2.1rem' }}>Dashboard Panitia Ormawa</h1>
                <p style={{ color: '#6B7280' }}>Ringkasan kegiatan kepengurusan HMIF ITB 2026/2027.</p>
              </div>
              <a href="finances.html" className="btn" style={{ background: 'var(--mem-pink)', color: '#FFF' }}>
                Kelola Budget & SPJ →
              </a>
            </div>

            <div className="grid-4">
              {stats.map((st, i) => (
                <div key={i} className="box" style={{ marginBottom: 0, background: st.bg }}>
                  <small style={{ fontFamily: 'var(--font-mono)', fontWeight: 700 }}>{st.label}</small>
                  <h2 style={{ fontFamily: 'var(--font-display)', marginTop: '0.25rem' }}>{st.value}</h2>
                </div>
              ))}
            </div>

            <div className="box">
              <h3 style={{ fontFamily: 'var(--font-display)', marginBottom: '1rem' }}>Menu Cepat Operasional</h3>
              <div style={{ display: 'flex', gap: '1rem', flexWrap: 'wrap' }}>
                <a href="events.html" className="btn" style={{ background: 'var(--mem-yellow)' }}>
                  📅 Kelola Event Kampus
                </a>
                <a href="sponsorship.html" className="btn" style={{ background: 'var(--mem-cyan)' }}>
                  🤝 Pipeline Sponsorship CRM
                </a>
                <a href="finances.html" className="btn" style={{ background: 'var(--mem-mint)' }}>
                  💰 Pencatatan Anggaran & SPJ
                </a>
                <a href="verify.html" className="btn" style={{ background: '#FFFFFF' }}>
                  🛡️ Verifikasi E-Sertifikat
                </a>
              </div>
            </div>
          </main>

          <footer className="footer">&copy; 2026 Convena — Platform Manajemen Event & Organisasi Mahasiswa</footer>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<DashboardPage />);
  </script>
</body>

</html>
