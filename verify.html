<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verifikasi E-Sertifikat — Convena</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;600;700&family=Space+Grotesk:wght@700;800&display=swap"
    rel="stylesheet"
  />

  <!-- External CSS -->
  <link rel="stylesheet" href="style.css" />

  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const CERTIFICATES = {
      'CNV-2026-ITB-8821': {
        code: 'CNV-2026-ITB-8821',
        name: 'Muhammad Rizky Ramadhan',
        event: 'Arkavidia 9.0: National Tech Festival & Hackathon',
        org: 'HMIF ITB',
        role: 'Peserta',
        date: '22 Oktober 2026',
      },
      'CNV-2026-UI-1042': {
        code: 'CNV-2026-UI-1042',
        name: 'Jessica Aurelia Siregar',
        event: 'UI Youth Leadership & Policy Forum 2026',
        org: 'BEM UI',
        role: 'Pembicara',
        date: '20 Oktober 2026',
      },
    };

    function VerifyPage() {
      const [code, setCode] = useState('CNV-2026-ITB-8821');
      const [result, setResult] = useState(CERTIFICATES['CNV-2026-ITB-8821']);

      const handleVerify = (e) => {
        e.preventDefault();
        setResult(CERTIFICATES[code.trim().toUpperCase()] || null);
      };

      return (
        <>
          <header className="navbar">
            <a href="index.html" className="brand">
              <div className="brand-box">C</div>
              <span>CONVENA</span>
            </a>
            <nav className="nav-links">
              <a href="index.html">Home</a>
              <a href="events.html">Events</a>
              <a href="dashboard.html">Dashboard</a>
              <a href="sponsorship.html">Sponsorship</a>
              <a href="finances.html">Budget & SPJ</a>
              <a href="verify.html" className="active">Verify</a>
              <a href="login.html">Login</a>
            </nav>
          </header>

          <main className="container" style={{ maxWidth: '760px', textAlign: 'center' }}>
            <h1 style={{ fontFamily: 'var(--font-display)', fontSize: '2.1rem', marginBottom: '0.5rem' }}>
              Verifikasi Keaslian E-Sertifikat
            </h1>
            <p style={{ color: '#6B7280', marginBottom: '1.5rem' }}>
              Masukkan kode ID sertifikat untuk mengecek keabsahan dokumen penghargaan acara.
            </p>

            <div className="box">
              <form onSubmit={handleVerify} style={{ display: 'flex', gap: '0.5rem' }}>
                <input
                  value={code}
                  onChange={(e) => setCode(e.target.value)}
                  placeholder="Contoh: CNV-2026-ITB-8821"
                  required
                />
                <button type="submit" className="btn" style={{ background: 'var(--mem-pink)', color: '#FFF' }}>
                  Cek Sertifikat
                </button>
              </form>
            </div>

            {result ? (
              <div className="box" style={{ background: '#FFF585' }}>
                <div style={{ fontFamily: 'var(--font-mono)', fontWeight: 700, fontSize: '0.8rem', marginBottom: '0.5rem' }}>
                  ✅ SERTIFIKAT RESMI TERVERIFIKASI ({result.code})
                </div>
                <h2 style={{ fontFamily: 'var(--font-display)', fontSize: '1.75rem', margin: '0.5rem 0' }}>
                  {result.name}
                </h2>
                <p>
                  Sebagai <strong>{result.role}</strong> dalam kegiatan <strong>{result.event}</strong> oleh{' '}
                  <strong>{result.org}</strong> ({result.date}).
                </p>
              </div>
            ) : (
              <div className="box" style={{ background: '#FFE4E6' }}>
                <h3 style={{ fontFamily: 'var(--font-display)' }}>❌ Sertifikat Tidak Ditemukan</h3>
                <p style={{ fontSize: '0.9rem', marginTop: '0.35rem' }}>
                  Kode "{code}" tidak terdaftar. Coba gunakan kode: <strong>CNV-2026-ITB-8821</strong>
                </p>
              </div>
            )}
          </main>

          <footer className="footer">&copy; 2026 Convena — Platform Manajemen Event & Organisasi Mahasiswa</footer>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<VerifyPage />);
  </script>
</body>

</html>
